name: ClusterFuzzLite Batch

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC

permissions: read-all

jobs:
  fuzz:
    name: Fuzz (Batch)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          language: go
          sanitizer: address

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          mode: batch
          fuzz-seconds: 3600
          output-sarif: true
          # Do not treat libFuzzer per-input timeouts as bugs. The Go targets
          # are built through go-118-fuzz-build, whose go-fuzz-headers consumer
          # expands bogus length prefixes in the fuzzer input into very large
          # buffers before the code under test is ever called. That is harness
          # work, not product work: the 124-byte input that timed out at 31s
          # returns from decodeMongoDoc in 264us when fed to it directly.
          # Raising the limit is not an option -- ClusterFuzzLite's cifuzz
          # runner builds libFuzzer arguments programmatically and never reads
          # the per-fuzzer .options files that OSS-Fuzz proper honours.
          # Crashes and OOMs remain reportable; only "timeout-*" testcases are
          # suppressed (cifuzz: `if testcase.startswith('timeout-')`).
          report-timeouts: false

      - name: Upload SARIF
        if: always() && steps.run.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: ${{ github.workspace }}

  prune:
    name: Prune Corpus
    runs-on: ubuntu-latest
    needs: fuzz
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          language: go
          sanitizer: address

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          mode: prune
          fuzz-seconds: 60
